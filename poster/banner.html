<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:#eef2f8; padding:20px;
  }
  .banner {
    width:1600px; height:700px; position:relative; overflow:hidden;
    background:linear-gradient(115deg,#3D7BFF 0%,#1A46C8 62%,#12308F 100%);
    display:flex; align-items:center; padding:0 90px; gap:80px;
  }
  .banner::after {
    content:""; position:absolute; width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.14) 0%,transparent 68%);
    right:-260px; top:-320px;
  }
  .left { flex:1; position:relative; z-index:2; }
  .icon {
    width:150px; height:150px; border-radius:34px; background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 18px 46px rgba(0,0,0,.24);
  }
  .icon .my { font-size:74px; font-weight:800; color:#2F6BFF; line-height:1; letter-spacing:-1px; }
  .icon .sub { font-size:20px; font-weight:700; color:#1A46C8; margin-top:6px; letter-spacing:1.5px; }
  h1 { font-size:82px; color:#fff; font-weight:800; margin-top:40px; letter-spacing:1px; }
  .desc { font-size:32px; color:rgba(255,255,255,.86); margin-top:20px; line-height:1.5; }
  .right { flex:1.05; position:relative; z-index:2; display:grid;
           grid-template-columns:repeat(4,1fr); gap:18px; }
  .t {
    background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.24);
    border-radius:20px; padding:22px 10px; text-align:center;
  }
  .t .e { font-size:38px; line-height:1; }
  .t .n { font-size:19px; color:#fff; font-weight:700; margin-top:12px; }
  .badge {
    position:absolute; bottom:44px; left:90px; z-index:2;
    font-size:22px; color:rgba(255,255,255,.66); letter-spacing:.5px;
  }
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="left">
    <div class="icon">
      <div class="my">MY</div>
      <div class="sub">MYkit</div>
    </div>
    <h1>杂货铺 MYkit</h1>
    <div class="desc">八个离线小工具 · 一个 App 全搞定<br>数据不出本机，断网照样能用</div>
  </div>
  <div class="right">
    <div class="t"><div class="e">📝</div><div class="n">备忘录</div></div>
    <div class="t"><div class="e">⏳</div><div class="n">倒数日</div></div>
    <div class="t"><div class="e">🔄</div><div class="n">格式转换</div></div>
    <div class="t"><div class="e">🎯</div><div class="n">转盘抽签</div></div>
    <div class="t"><div class="e">🎴</div><div class="n">背记器</div></div>
    <div class="t"><div class="e">✍️</div><div class="n">手写签名</div></div>
    <div class="t"><div class="e">📅</div><div class="n">课表</div></div>
    <div class="t"><div class="e">📷</div><div class="n">水印打卡</div></div>
  </div>
  <div class="badge">moYan · MYkit</div>
</div>
</body>
</html>
